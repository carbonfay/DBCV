version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: postgres_dbcv
    env_file:
      - env.dev
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    command: -p 5433
    ports:
      - "5433:5433"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -h 127.0.0.1 -p 5433"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: redis_dbcv
    command: redis-server --maxmemory 2gb --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  cache-redis:
    image: redis:latest
    container_name: cache_redis_dbcv
    command: redis-server --maxmemory 1gb --maxmemory-policy noeviction --port 6389
    ports:
      - "6389:6389"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  s3:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    container_name: s3_dbcv
    command: server /data --console-address ":9002"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9002:9002"
    volumes:
      - s3_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  s3-init:
    image: minio/mc:latest
    container_name: s3_init_dbcv
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "
      mc alias set local http://s3:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb -p local/dbcv-media || true &&
      mc anonymous set download local/dbcv-media || true &&
      exit 0
      "
    restart: on-failure:3

networks:
  default:
    name: dbcv_dev_net

volumes:
  postgres_data:
  s3_data:
