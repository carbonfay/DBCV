[pytest]
testpaths = app/tests/integrations
python_files = test_*.py
python_functions = test_*
norecursedirs = .git .tox .mypy_cache .pytest_cache __pycache__
addopts = -v --tb=short --no-header --no-summary -q
pythonpath = .

# Disable warning about test discovery in directories without __init__.py
python_classes = Test*
